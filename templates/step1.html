{% extends "base.html" %}

{% block title %}Step 1 - Personal Information{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-container">
        <div class="step-indicator">
            <div class="step active">
                <span class="step-number">1</span>
                <span class="step-label">Personal Info</span>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <span class="step-label">Line of Business</span>
            </div>
            <div class="step">
                <span class="step-number">3</span>
                <span class="step-label">Coverage</span>
            </div>
            <div class="step">
                <span class="step-number">4</span>
                <span class="step-label">Premium</span>
            </div>
            <div class="step">
                <span class="step-number">5</span>
                <span class="step-label">Policy</span>
            </div>
        </div>

        <div class="form-card">
            <h2>Step 1: Personal Information</h2>
            <p class="step-description">Please enter your personal details below to get started.</p>

            <form method="POST" action="{{ url_for('step1') }}" id="step1-form">
                <div class="form-group">
                    <label for="full_name">
                        Full Name
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="full_name" 
                        name="full_name" 
                        placeholder="Enter your full name"
                        data-testid="full_name_input"
                        required
                    >
                    <span class="error-message" id="full_name_error"></span>
                </div>

                <div class="form-group">
                    <label for="age">
                        Age
                        <span class="required">*</span>
                    </label>
                    <input 
                        type="number" 
                        id="age" 
                        name="age" 
                        placeholder="Enter your age"
                        data-testid="age_input"
                        min="18"
                        max="99"
                        required
                    >
                    <span class="error-message" id="age_error"></span>
                </div>

                <div class="form-group">
                    <label for="address">
                        Address
                        <span class="required">*</span>
                    </label>
                    <textarea 
                        id="address" 
                        name="address" 
                        placeholder="Enter your complete address"
                        data-testid="address_textarea"
                        rows="4"
                        required
                    ></textarea>
                    <span class="error-message" id="address_error"></span>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" id="step1_submit_btn">Next Step</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="{{ url_for('static', filename='js/form-validation.js') }}"></script>
{% endblock %}
